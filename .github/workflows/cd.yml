name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Capture API URL
        id: output
        working-directory: terraform
        run: echo "api_invoke_url=$(terraform output -raw api_invoke_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="${{ steps.output.outputs.api_invoke_url }}"
          ID="smoke-$(date +%s)"

          status=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST "$URL/items" \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$ID\",\"name\":\"cd-smoke-test\"}")
          test "$status" -eq 201

          status=$(curl -s -o /tmp/read.json -w '%{http_code}' "$URL/items/$ID")
          test "$status" -eq 200

          curl -s -o /dev/null -X DELETE "$URL/items/$ID"
